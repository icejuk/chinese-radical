<!doctype html><html lang="th"><meta charset="utf-8"><title>ORBIT responsive check</title><style>body{font:14px system-ui;background:#e5e7eb}iframe{display:block;margin:15px auto;border:0;height:900px;background:#101624;max-width:none}select{padding:10px}output{margin-left:12px}</style><label>ความกว้าง <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select></label><output id="report"></output><iframe id="frame" title="ORBIT responsive preview"></iframe><script>
const field=document.querySelector('select'),frame=document.querySelector('iframe');function load(){frame.style.width=field.value+'px';frame.src='../map-design-preview.html?theme=orbit&device='+(Number(field.value)<=700?'mobile':'desktop')}field.onchange=load;frame.onload=()=>{const d=frame.contentDocument;const inspect=()=>{const c=d.querySelector('#canvas'),t=d.querySelector('.controls');if(!c||!t)return;const r=c.getBoundingClientRect(),b=t.getBoundingClientRect();document.querySelector('output').textContent=`${field.value}px · nodes ${d.querySelectorAll('.node').length} · toolbar ${b.left>=r.left&&b.right<=r.right&&b.bottom<=r.bottom?'inside':'outside'} · overflow ${d.documentElement.scrollWidth>d.documentElement.clientWidth?'yes':'no'}`};new ResizeObserver(inspect).observe(d.body);inspect()};load();
</script></html>
