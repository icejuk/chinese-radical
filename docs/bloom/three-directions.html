</style><main><header><div><small>CHINESE WORD MAP / DESIGN STUDY</small><h1>แผนที่เดียวกัน สามบุคลิกใหม่</h1><p>เลือกแบบที่ชอบ แล้วลองซูม ลาก และแตะคำด้านล่าง</p></div></header><section class="options" aria-label="เลือกแนวทางดีไซน์"><button class="option" data-theme="atlas" aria-pressed="true"><div class="swatches"><i style="background:#193b64"></i><i style="background:#7ba8e6"></i><i style="background:#e5edf6"></i></div><small>A / CLEAR & STRUCTURED</small><strong>ATLAS</strong><span>สมุดแผนที่ · โปร่ง ชัด เป็นระเบียบ</span></button><button class="option" data-theme="orbit" aria-pressed="false"><div class="swatches"><i style="background:#121a2b"></i><i style="background:#bda7ff"></i><i style="background:#8ee0d4"></i></div><small>B / IMMERSIVE & SPATIAL</small><strong>ORBIT</strong><span>จักรวาลคำ · มืด สงบ เส้นทางเด่น</span></button><button class="option" data-theme="paper" aria-pressed="false"><div class="swatches"><i style="background:#986b4c"></i><i style="background:#f4dac4"></i><i style="background:#fffaf1"></i></div><small>C / WARM & PERSONAL</small><strong>คำต่อคำ</strong><span>สมุดเรียน · อุ่น นุ่ม เหมือนจดเอง</span></button></section><div class="bar"><p id="description">ATLAS — การ์ดชิดซ้าย เส้นสีน้ำเงิน รายละเอียดแบบพจนานุกรม</p><div class="devices"><button id="desktop" aria-pressed="true">คอม</button><button id="mobile" aria-pressed="false">มือถือ</button></div></div><section class="stage"><iframe id="preview" title="พรีวิวแผนที่คำ ATLAS" src="map-design-preview.html?theme=atlas&device=desktop"></iframe></section><div class="foot"><span>ORBIT เพิ่มเป็น 63 คำ / 8 กลุ่มจากคลังแอป · A และ C เป็นชุดตัวอย่างเดิม</span><a id="full" href="map-design-preview.html?theme=atlas&device=desktop" target="_blank">เปิดแบบนี้เต็มหน้า ↗</a></div></main><script>
let theme='orbit',device=innerWidth<600?'mobile':'desktop';const descriptions={atlas:'ATLAS — การ์ดชิดซ้าย เส้นสีน้ำเงิน รายละเอียดแบบพจนานุกรม',orbit:'ORBIT — พื้นที่มืด โหนดลอย และเส้นทางสีม่วงที่ช่วยนำสายตา',paper:'คำต่อคำ — คำบนกระดาษ เส้นใต้แทนกล่อง และตัวอักษรจีนแบบลายมือ'};function show(){document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===theme));document.querySelector('#desktop').setAttribute('aria-pressed',device==='desktop');document.querySelector('#mobile').setAttribute('aria-pressed',device==='mobile');const f=document.querySelector('iframe');f.className=device==='mobile'?'mobile':'';f.src=`map-design-preview.html?theme=${theme}&device=${device}`;f.title='พรีวิวแผนที่คำ '+theme;document.querySelector('#description').textContent=descriptions[theme];document.querySelector('#full').href=f.src;}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;show()});document.querySelector('#desktop').onclick=()=>{device='desktop';show()};document.querySelector('#mobile').onclick=()=>{device='mobile';show()};show();
