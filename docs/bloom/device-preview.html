<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLOOM · ตรวจขนาดหน้าจอ</title><style>*{box-sizing:border-box}body{margin:0;background:#e7eddf;color:#36543e;font:13px/1.6 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:center;gap:15px;padding:12px}select{font:inherit;padding:5px 8px;background:#fff;border:1px solid #c7d7bb;border-radius:9px}a{color:inherit}#shell{box-sizing:content-box;margin:auto;width:390px;height:620px;border:1px solid #cadbbf;border-radius:18px;overflow:hidden;background:#f3f8ee}iframe{width:100%;height:100%;border:0;display:block}output{display:block;text-align:center;padding:8px;font-size:11px;min-height:33px;color:#55774c}</style></head><body><header><b>BLOOM · แอปจริง</b><label>ขนาด <select id="width" aria-label="ขนาดหน้าจอ"><option>320</option><option>375</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select> px</label><label>ตัวอย่าง <select id="scene" aria-label="ตัวอย่างต้นไม้"><option value="day">生日 → 日 · 10 คำใหม่</option><option value="people" selected>人 · 16 คำ</option><option value="family">人 → 家人 → 家</option><option value="water">水 · 7 คำ</option><option value="wood">木 · 6 คำ</option><option value="material">木材 → 材</option><option value="expanded">学 → 学生 → 生</option></select></label><label>หน้า <select id="page" aria-label="หน้าที่ทดสอบ"><option value="map">แผนที่</option><option value="home">หน้าแรก</option><option value="sentences">ประโยค</option><option value="review">ทบทวน</option><option value="speaking">ฝึกพูด</option></select></label><a href="/">เปิดเต็มจอ ↗</a></header><div id="shell"><iframe id="app" title="BLOOM บนหน้าจอจำลอง" src="/#map?focus=c%3A%E4%BA%BA"></iframe></div><output id="report" aria-live="polite">กำลังเปิดแอป…</output><output id="cards-report"></output><script>
const frame=document.querySelector('#app'),shell=document.querySelector('#shell'),report=document.querySelector('#report');let observer,resize,scheduled=false;
function check(){if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;const doc=frame.contentDocument;if(!doc?.querySelector('.bloom-app')){report.textContent='กำลังเปิด BLOOM…';return}const nodes=[...doc.querySelectorAll('.bl-map-node')].map(el=>el.getBoundingClientRect());let overlaps=0;nodes.forEach((a,i)=>nodes.slice(i+1).forEach(b=>{if(a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top)overlaps++}));const selected=doc.querySelector('.bl-map-node[aria-pressed="true"]'),viewport=doc.querySelector('.bl-map-viewport'),dock=doc.querySelector('.bl-reading-dock');if(selected&&viewport){const r=selected.getBoundingClientRect(),v=viewport.getBoundingClientRect(),d=dock?.getBoundingClientRect(),limit=d?.height?Math.min(v.bottom,d.top):v.bottom;const scale=r.width/selected.offsetWidth;const font=parseFloat(doc.defaultView.getComputedStyle(selected.querySelector('.bl-pinyin')).fontSize)*scale;document.querySelector('#cards-report').textContent=`คำที่เลือก ${selected.querySelector('.bl-han,.bl-collection-label').textContent} · พินอิน ${font.toFixed(1)}px · `+(r.left>=v.left-1&&r.right<=v.right+1&&r.top>=v.top-1&&r.bottom<=limit+1?'เห็นการ์ดครบ ไม่ถูกแผงอ่านบัง':'การ์ดที่เลือกมีส่วนถูกบัง')}else document.querySelector('#cards-report').textContent='';const root=doc.documentElement;report.textContent=`${root.clientWidth}px · ${nodes.length} จุด · ${overlaps?'ทับกัน '+overlaps+' คู่':'การ์ดไม่ทับกัน'} · ${root.scrollWidth>root.clientWidth?'หน้าเว็บล้นแนวนอน':'หน้าเว็บไม่ล้นแนวนอน'}`})}
document.querySelector('#page').addEventListener('change',event=>{frame.src=event.target.value==='home'?'/#map':event.target.value==='map'?'/#map?focus=c:木':'/#'+event.target.value+'?word=w:学生'});
document.querySelector('#scene').addEventListener('change',event=>{if(event.target.value==='day'){const p=new URLSearchParams({focus:'c:学',at:'c:学/w:学生/c:生/w:生日/c:日'});p.append('open','c:学/w:学生/c:生');p.append('open','c:学/w:学生/c:生/w:生日/c:日');frame.src='/#map?'+p.toString();return}const expanded=event.target.value==='family'?'c:人/w:家人/c:家':event.target.value==='material'?'c:木/w:木材/c:材':'c:学/w:学生/c:生';const params=new URLSearchParams({focus:['people','family'].includes(event.target.value)?'c:人':['wood','material'].includes(event.target.value)?'c:木':event.target.value==='expanded'?'c:学':'c:水'});if(['expanded','material','family'].includes(event.target.value)){params.set('at',expanded);params.append('open',expanded)}frame.src='/#map?'+params.toString()});
frame.addEventListener('load',()=>{observer?.disconnect();resize?.disconnect();const doc=frame.contentDocument;doc.addEventListener('transitionend',check,true);observer=new MutationObserver(check);observer.observe(doc.documentElement,{attributes:true,childList:true,subtree:true,characterData:true});resize=new ResizeObserver(check);resize.observe(doc.documentElement);check()});document.querySelector('#width').addEventListener('change',event=>{shell.style.width=event.target.value+'px';check()});
</script></body></html>
